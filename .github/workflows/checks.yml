name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-app.txt
      - run: python -m pytest -q
      - run: python -m compileall -q nexus scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nexus/static/app.js
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexusos:check .
      - name: Verify container readiness
        run: |
          docker run -d --name nexus-check -p 127.0.0.1:8766:8766 nexusos:check
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8766/health; then exit 0; fi
            sleep 2
          done
          docker logs nexus-check
          exit 1
