[project]
name = "nexusos"
version = "0.8.0"
description = "Evidence-backed AI support resolution for a fictional subscription product"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.31.1,<1", "pydantic>=2.10,<3", "numpy>=1.26,<3", "httpx>=0.27.1,<1", "python-dotenv>=1,<2", "langgraph>=1,<2", "mcp>=1.20,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["static/*", "migrations/*.sql"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
retrieval = ["sentence-transformers>=5,<6", "torch>=2.6,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
